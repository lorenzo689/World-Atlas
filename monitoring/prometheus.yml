# Scrapes the backend's /actuator/prometheus. The backend runs on the host (./mvnw spring-boot:run),
# which containers reach as host.docker.internal (Docker Desktop; on Linux see extra_hosts in compose).
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: world-explorer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080", "backend:8080"]
