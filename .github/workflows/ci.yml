name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Committed data (history, WWII provenance, map detail, conflict pair, map audit)
        # One sequence for CI and local use: scripts/lib/verify-data.mjs. Fails when a verifier fails, the
        # audit regresses against scripts/map-audit-baseline.json, or docs/MAP-AUDIT.md is stale.
        run: npm run verify:data
      - name: Country geometry is reproducible from its sources
        # Rebuilds countries/boundaries/geometry and fails if the committed files differ, so the
        # shipped map can only change through scripts/build-data.mjs.
        run: |
          npm run data
          git diff --exit-code --stat -- public/data/countries.json public/data/boundaries.json public/data/geometry.json public/data/geometry.bin
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Production viewer browser smoke (including CSP)
        run: CHROME_PATH=$(which google-chrome) npm run smoke
      - name: Scenario and World War II browser smokes (frontend only, production build)
        # The smoke scripts need a server; vite preview serves the build just checked.
        run: |
          nohup npx vite preview --port 4173 --strictPort > ../preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:4173/ > /dev/null && break; sleep 1; done
          CHROME_PATH=$(which google-chrome) SMOKE_URL=http://localhost:4173/ npm run smoke:ww2
          CHROME_PATH=$(which google-chrome) SMOKE_URL=http://localhost:4173/explore npm run smoke:scenarios
      - name: Transfer size and draw-call budgets (home and WWII view)
        # perf-budget.json "always" limits hold on software GL. The 54 MB historical geometry went unnoticed
        # for weeks because nothing measured the WWII view in CI.
        run: CHROME_PATH=$(which google-chrome) npm run perf

  backend:
    runs-on: ubuntu-latest # has Docker, which Testcontainers needs for the *IT tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Unit + integration tests (PostgreSQL, Redis, Kafka, Elasticsearch via Testcontainers)
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  e2e:
    # Full stack in a real browser: infrastructure from docker-compose.yml, the backend jar, `vite preview`
    # (proxying /api and /ws) and Chrome driven by scripts/e2e.mjs.
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - run: docker compose up -d --wait postgres redis kafka elasticsearch
      - name: Build and start the backend
        working-directory: backend
        run: |
          ./mvnw -B -q -DskipTests package
          nohup java -jar target/world-explorer-backend-*.jar \
            --app.rate-limit.auth-per-minute=100000 --app.rate-limit.api-per-minute=1000000 \
            --app.ingestion.bootstrap-on-startup=false > ../backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:8080/api/health && break; sleep 2; done
          curl -sf localhost:8080/api/health
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: End-to-end test
        run: CHROME_PATH=$(which google-chrome) npm run e2e -- --screenshots e2e-screenshots
        working-directory: frontend
      - name: Historical data context (needs the backend for populations)
        run: CHROME_PATH=$(which google-chrome) npm run smoke:history
        working-directory: frontend
      - name: Close-zoom map detail
        run: CHROME_PATH=$(which google-chrome) npm run smoke:detail
        working-directory: frontend
      - name: Detailed OSM border streaming (pinned fixture, production CSP)
        run: CHROME_PATH=$(which google-chrome) npm run smoke:detail -- --osm-fixture
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            frontend/e2e-screenshots
            backend.log
