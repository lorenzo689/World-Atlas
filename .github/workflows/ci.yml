name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest # has Docker, which Testcontainers needs for the *IT tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Unit + integration tests (PostgreSQL, Redis, Kafka, Elasticsearch via Testcontainers)
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
