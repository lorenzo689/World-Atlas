name: Historical map demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run data:history:verify
      - run: npm run data:detail:verify
      - run: npm test
      - run: npm run build
        env:
          VITE_STATIC_DEMO: 'true'
      - name: Historical lessons and conflict layer in Chrome
        run: |
          VITE_STATIC_DEMO=true npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/World-Atlas/ && break; sleep 1; done
          SMOKE_URL=http://127.0.0.1:4173/World-Atlas/ CHROME_PATH=$(which google-chrome) npm run smoke:history
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
